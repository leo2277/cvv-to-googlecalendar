name = "cvv-to-calendar"
main = "src/worker/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build:frontend"

[assets]
directory = "dist/frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cvv-calendar-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

[triggers]
crons = ["0 6,14,20 * * *"]

[vars]
DASHBOARD_USERNAME = "admin"

# [secrets]
# CVV_USERNAME = ""         # Set via: wrangler secret put CVV_USERNAME
# CVV_PASSWORD = ""         # Set via: wrangler secret put CVV_PASSWORD
# CVV_STUDENT_ID = ""       # Set via: wrangler secret put CVV_STUDENT_ID
# GOOGLE_SERVICE_ACCOUNT_JSON = ""  # Set via: wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
# GOOGLE_CALENDAR_ID = ""   # Set via: wrangler secret put GOOGLE_CALENDAR_ID
# DASHBOARD_PASSWORD = ""   # Set via: wrangler secret put DASHBOARD_PASSWORD
